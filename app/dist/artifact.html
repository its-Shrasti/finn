<title>FINN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; sticky masthead, fixed ask bar + tab bar. Triage first, detail on demand. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E4E9EE; --ink:#13202B; --muted:#5B6874; --faint:#8794A0; --line:#D7DEE5;
  --accent:#2A3F9D; --accent-soft:#E3E7F7; --pos:#11795A; --pos-soft:#DDF1E9; --neg:#BE3426; --neg-soft:#F8E1DD;
  --amber:#B87500; --amber-soft:#F8ECD3; --sim:#6B4FA0;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgb(19 32 43 / .06), 0 4px 16px rgb(19 32 43 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#151E26; --sunk:#1B2630; --ink:#E5EBF0; --muted:#97A4B0; --faint:#6E7C88; --line:#25323D;
  --accent:#93A6FF; --accent-soft:#1F2847; --pos:#45C796; --pos-soft:#123328; --neg:#FF7B6B; --neg-soft:#3A1D1A;
  --amber:#F0B547; --amber-soft:#36290F; --sim:#B49AE6; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#151E26; --sunk:#1B2630; --ink:#E5EBF0; --muted:#97A4B0; --faint:#6E7C88; --line:#25323D;
  --accent:#93A6FF; --accent-soft:#1F2847; --pos:#45C796; --pos-soft:#123328; --neg:#FF7B6B; --neg-soft:#3A1D1A;
  --amber:#F0B547; --amber-soft:#36290F; --sim:#B49AE6; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font:700 26px/1 var(--f-display);letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--accent)}
.asof{font-size:12px;color:var(--muted);line-height:1.25;min-width:0}
.asof b{color:var(--ink);font-weight:600}
.mast .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* section heads */
h1,h2,h3{text-wrap:balance;margin:0}
.view{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h1{font:700 28px/1.12 var(--f-display);letter-spacing:-.02em}
.h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* brief */
.read{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.read ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.read li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.45}
.read li .tk{margin-top:2px}
.funnel{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.funnel .num{color:var(--ink);font-weight:600}
.funnel .arrow{color:var(--faint)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tk{font:600 11px/1 var(--f-mono);letter-spacing:.02em;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--ink);white-space:nowrap}

.group-h{display:flex;align-items:baseline;gap:8px}
.group-h .count{font:600 12px var(--f-mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.act{background:var(--neg)} .dot.know{background:var(--amber)} .dot.noise{background:var(--faint)}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.act{border-left:3px solid var(--neg)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.card-top .co{color:var(--ink);font-weight:600}
.card-top .sp{flex:1}
.cat{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card h3{font:600 16px/1.35 var(--f-body)}
.card p{margin:0;color:var(--muted);font-size:14px}
.why{font-size:12px;color:var(--faint)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{padding:5px 11px;font-size:12px}
.related summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none}
.related summary::-webkit-details-marker{display:none}
.related ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.cleared{opacity:.55}

.know-list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.know-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.know-row:first-child{border-top:0}
.know-row .t{font-size:14px;line-height:1.4}
.know-row .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.know-row .d{font-size:11.5px;color:var(--faint);white-space:nowrap}

.routine{background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.routine summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
.routine summary::-webkit-details-marker{display:none}
.routine .grp{margin-top:10px;font-size:12.5px;color:var(--muted)}
.routine .grp b{color:var(--ink);font-weight:600}
.routine ul{margin:4px 0 0;padding-left:16px}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r);font-size:14px}

/* results table */
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt td{padding:7px 0;border-bottom:1px solid var(--line);text-align:right}
.rt tr:last-child td{border-bottom:0}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--muted)}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.4}
.flag.neg{background:var(--neg-soft);color:var(--neg)} .flag.pos{background:var(--pos-soft);color:var(--pos)} .flag.neutral{background:var(--sunk);color:var(--muted)}
.enrich{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.enrich .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.person{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--f-display)}
.person b{font-size:15px}
.person small{display:block;color:var(--muted);font-size:12.5px}
.enrich ul{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}
.sowhat{font-size:13.5px;font-weight:600}
.srcs{font-size:11.5px;color:var(--faint);overflow-wrap:anywhere}
.cov{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.cov:first-child{border-top:0}
.cov .t{font-size:13.5px;line-height:1.35;min-width:0}
.cov .p{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cov .gap{color:var(--amber);font-weight:600}
.xmap{display:flex;flex-direction:column}
.xrow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:9px 14px;border-top:1px solid var(--line);align-items:center}
.xrow:first-child{border-top:0}
.xrow .th{font-size:12.5px;font-weight:600;color:var(--muted)}
.xrow .ppl{display:flex;flex-wrap:wrap;gap:4px 12px;min-width:0}
.xrow button{background:none;border:0;padding:0;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
/* network: who in your own network can help with this */
.net{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.net .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.who{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;background:none;border:0;padding:0;width:100%;min-width:0}
.who .avatar{width:32px;height:32px;font-size:12px;background:var(--surface);border:1.5px dashed var(--accent)}
.who .nm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.who .wl{display:block;font-size:13px;line-height:1.45;color:var(--ink);margin-top:3px}
.who .meta{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.str{display:inline-flex;gap:2px;align-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.str i{width:4px;height:11px;border-radius:1px;background:var(--line)} .str span{margin-left:4px}
.str.strong i{background:var(--pos)} .str.medium i:nth-child(-n+2){background:var(--amber)} .str.weak i:first-child{background:var(--faint)}
.net details summary{font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
.net details summary::-webkit-details-marker{display:none}
.net details[open] summary{margin-bottom:8px}
.net .alt{display:flex;flex-direction:column;gap:9px}
.net .fine{font-size:11.5px;color:var(--faint);line-height:1.4}
.net .comp{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:5px 8px;margin-top:5px}
.netmoment{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-left:3px solid var(--accent);padding:10px 12px;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.netmoment .top{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.netmoment .top .sp{flex:1}
.netmoment .foot{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;padding-left:42px}
.netmoment .row{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center}
.netmoment .avatar{width:32px;height:32px;font-size:12px;background:var(--surface);border:1.5px dashed var(--accent)}
.netmoment .nm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
.netmoment .ln{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pathsvg{display:block;width:100%;height:auto;max-width:420px;overflow:visible;font-family:var(--f-body)}
.pathsvg .e{fill:none;stroke-linecap:round}
.pathsvg .e.strong{stroke:var(--pos)} .pathsvg .e.medium{stroke:var(--amber)} .pathsvg .e.weak{stroke:var(--faint)}
.pathsvg .e.hyp{stroke-dasharray:1 5}
.pathsvg .n{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.pathsvg .n.syn{stroke-dasharray:3 2}
.pathsvg .n.me{fill:var(--ink);stroke:var(--ink)}
.pathsvg .n.exec{fill:var(--accent-soft)}
.pathsvg .ini{fill:var(--accent);font-size:8.5px;font-weight:700}
.pathsvg .ini.me{fill:var(--bg)}
.pathsvg .nm{fill:var(--ink);font-size:10.5px;font-weight:600}
.pathsvg .lb{fill:var(--muted);font-size:9.5px}
.nethint{display:block;margin-top:4px;font-size:12px;color:var(--accent)}
.syntag{font:600 10px var(--f-mono);color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 4px}
.career{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.career li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.career .y{font:500 11.5px var(--f-mono);color:var(--faint);padding-top:1px}

/* alerts */
.rules{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.sentence{font:500 17px/1.7 var(--f-display);letter-spacing:-.005em}
.tok{display:inline-flex;align-items:center;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 2px 2px;padding:0 2px}
.tok input,.tok select{border:0;background:transparent;font:600 17px var(--f-mono);color:var(--accent);width:3.2ch;text-align:center;padding:0;appearance:textfield;-moz-appearance:textfield}
.tok input::-webkit-outer-spin-button,.tok input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tok select{width:auto;padding-right:2px}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.catgrid label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.catgrid input{accent-color:var(--accent);margin:0}
.override{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.override select,.override input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 8px}
.override input{width:64px}
.ovl{display:flex;gap:6px;flex-wrap:wrap}
.ovl span{font-size:12px;background:var(--sunk);border-radius:999px;padding:4px 6px 4px 10px;display:inline-flex;gap:6px;align-items:center}
.ovl button{border:0;background:none;color:var(--muted);padding:0 4px}
.alert{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .t{font-size:14px;line-height:1.4;min-width:0}
.alert .t small{display:block;color:var(--muted);font-size:12px}
.sev{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 5px;margin-right:4px}
.sev.s3{background:var(--neg-soft);color:var(--neg)} .sev.s2{background:var(--amber-soft);color:var(--amber)}
.simtag{font:600 10px var(--f-mono);color:var(--sim);border:1px solid currentColor;border-radius:4px;padding:1px 4px;vertical-align:1px}
.spark{width:110px;height:34px;display:block}

/* book */
.season{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .v{font:600 22px/1.1 var(--f-mono)}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.book{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
.book table{width:100%;border-collapse:collapse;font-size:13px;min-width:320px}
.book th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.book th:first-child{text-align:left;padding-left:14px}
.book td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.book td:first-child{text-align:left;padding-left:14px}
.book td:last-child,.book th:last-child{padding-right:14px}
.book tr:last-child td{border-bottom:0}
.book tbody tr{cursor:pointer}
.book tbody tr:hover{background:var(--sunk)}
.heat{display:inline-block;min-width:48px;text-align:right;border-radius:5px;padding:2px 6px;font:500 12.5px var(--f-mono)}
.book .nm{font-weight:600}
.book .nm small{display:block;font-weight:400;color:var(--faint);font-size:11px}

/* research */
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picker form{display:flex;gap:6px;flex:1;min-width:180px}
.picker input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;text-transform:uppercase}
.rhead{display:flex;flex-direction:column;gap:6px}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:15;background:var(--bg);padding-block:8px}
.sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:120px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cred{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.cred .big{font:700 40px/1 var(--f-display);letter-spacing:-.03em}
.cred .big small{font-size:18px;color:var(--muted);font-weight:500}
.tally{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:6px}
.tally span{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.promise{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.promise:first-of-type{border-top:0;padding-top:0}
.promise .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.promise .m{font-weight:600;font-size:14px}
.promise .mi{font-size:11.5px;color:var(--faint)}
.promise .said{font-size:13.5px}
.promise .did{font-size:13px;color:var(--muted)}
.promise .cav{font-size:12px;color:var(--faint);font-style:italic}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:3px 6px;white-space:nowrap}
.v-beat,.v-delivered,.v-on_track,.v-agree{background:var(--pos-soft);color:var(--pos)}
.v-missed,.v-walked_back,.v-diverge{background:var(--neg-soft);color:var(--neg)}
.v-at_risk{background:var(--amber-soft);color:var(--amber)}
.v-pending,.v-unscored,.v-too_early{background:var(--sunk);color:var(--muted)}
.nvn{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.nvn:first-child{border-top:0;padding-top:0}
.nvn .row{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:13.5px}
.nvn .row span:first-child{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:3px}
.nvn .note{font-size:12.5px;color:var(--muted);padding-left:70px}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.bb{grid-template-columns:1fr}}
.bb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.bb .h{font:700 15px var(--f-display);display:flex;gap:6px;align-items:center}
.src{font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--f-mono)}
.chart .lab{fill:var(--ink);font-weight:600}
.minitbl{width:100%;border-collapse:collapse;font-size:12.5px}
.minitbl th{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.minitbl td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
.minitbl th:first-child,.minitbl td:first-child{text-align:left}
.tblwrap{overflow-x:auto}
.verdict{font-size:13.5px;padding:10px 12px;border-radius:8px}
.foot{font-size:12px;color:var(--faint);display:flex;flex-direction:column;gap:6px}
.foot a{overflow-wrap:anywhere}

/* ask + nav */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 4px;display:flex;flex-direction:column;gap:8px}
.askbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--muted);font-size:14.5px;text-align:left;box-shadow:var(--shadow)}
.askbar svg{flex:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:6px 0 8px;font-size:11.5px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--neg);color:#fff;font:600 10px var(--f-mono);border-radius:999px;padding:1px 5px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 16 22 / .45);z-index:40}
/* first-open tour */
.tourcard{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tourcard .top{display:flex;align-items:center;gap:8px}

.tourcard .top .sp{flex:1}
.tourcard .x{border:0;background:none;font-size:18px;line-height:1;color:var(--muted);padding:2px 6px}
.tourcard ol{margin:0;padding-left:20px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.tourcard .btn{align-self:flex-start}
.coach{position:fixed;left:0;right:0;z-index:30;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.coach-in{pointer-events:auto;width:100%;max-width:536px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgb(0 0 0 / .28);display:flex;flex-direction:column;gap:8px}
.coach-in .h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.coach-in .h .sp{flex:1}
.coach-in .t{font:700 16px var(--f-display)}
.coach-in p{margin:0;font-size:13.5px;line-height:1.45}
.coach-in .row{display:flex;gap:8px;justify-content:flex-end}
.coach-in .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.coach-in .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.coach-in .x{border:0;background:none;color:inherit;font-size:18px;line-height:1;padding:0 4px;opacity:1}
.tour-hl{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){.tour-hl{animation:tourpulse 1.4s ease-out 2}@keyframes tourpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 16px transparent}}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgb(0 0 0 / .2)}

.askform{display:flex;gap:8px}
.askform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}

  // The best path, drawn: You -> (via) -> contact -> executive. Line thickness = that hop's strength

  function pathSvg(x, t) {
    const hops = x.hops || (x.via ? ["me", x.via, x.contact] : ["me", x.contact]);

    const CLOSE = { 3: "close", 2: "regular", 1: "met" };

      "Persistent Systems": "Persistent", "Dixon Technologies": "Dixon", "Sun Pharmaceutical": "Sun Pharma", "Cyril Amarchand Mangaldas": "CAM", "AZB & Partners": "AZB" };
    const maxc = Math.max(6, Math.floor((gap - 2 * r - 6) / 5.2));              // what fits between the circles
    const cut = s => { if (!s) return ""; if (s.length > maxc && SHORT[s]) s = SHORT[s]; return s.length > maxc ? s.slice(0, maxc - 1) + "…" : s; };
    const name = nd => nd === "me" ? "You" : nd === "target" ? t.name.split(" ").pop() : first(nd);
    const ini = nd => nd === "me" ? "Y" : nd === "target" ? t.name.split(" ").map(w => w[0]).slice(0, 2).join("") : NP(nd).initials;
    let g = "";
    for (let i = 0; i < n - 1; i++) {

      g += `<text class="lb" x="${mx}" y="${cy - 9}" text-anchor="middle">${esc(cut(labs[i][0]))}</text>`;

      g += `<text class="nm" x="${X(i)}" y="${cy + 28}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" dx="${i === 0 ? -r : i === n - 1 ? r : 0}">${esc(name(nd))}</text>`;
    });
    const aria = nodes.map(name).join(" to ") + `. ${x.label} overall.`;
    return `<svg class="pathsvg" viewBox="0 0 ${W} 64" role="img" aria-label="Best path: ${esc(aria)}">${g}</svg>`;
  }
  const label3 = v => v >= 0.5 ? "strong" : v >= 0.3 ? "medium" : "weak";
  const WM = N && N.meta.why_model, WC = (N && N.meta.why_counts) || {};

  function scanAlerts() {

  }
  function spark(bars, idx) {
    const s = bars.slice(-40); const off = bars.length - s.length; const xs = s.map(b => b.close);
    const lo = Math.min(...xs), hi = Math.max(...xs), W = 110, H = 34, p = 3;

  // ---------- RESEARCH ----------
  function lineBar(annual, margins) {
    const W = 340, H = 170, pl = 8, pr = 30, pt = 18, pb = 22;
    const n = annual.length, bw = (W - pl - pr) / n * .58;
    const maxS = Math.max(...annual.map(a => a.sales)) * 1.05;
    const ms = margins.map(m => m.ebitda_margin).filter(v => v != null);
    const mlo = Math.floor(Math.min(...ms) - 2), mhi = Math.ceil(Math.max(...ms) + 2);
    const cx = i => pl + (i + .5) * (W - pl - pr) / n;
    const yS = v => pt + (1 - v / maxS) * (H - pt - pb), yM = v => pt + (1 - (v - mlo) / (mhi - mlo)) * (H - pt - pb);
    const bars = annual.map((a, i) => `<rect x="${cx(i) - bw / 2}" y="${yS(a.sales)}" width="${bw}" height="${H - pb - yS(a.sales)}" rx="2" fill="${a.y === "TTM" ? "var(--line)" : "var(--accent-soft)"}" stroke="var(--accent)" stroke-opacity=".35"/><text x="${cx(i)}" y="${H - 7}" text-anchor="middle">${a.y}</text><text x="${cx(i)}" y="${yS(a.sales) - 4}" text-anchor="middle" class="${i === n - 2 ? "lab" : ""}">${(a.sales / 1000).toFixed(a.sales < 10000 ? 1 : 0)}k</text>`).join("");
    const pts = margins.map((m, i) => [cx(i), yM(m.ebitda_margin)]);
    const line = `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")}" fill="none" stroke="var(--amber)" stroke-width="2"/>` + pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--amber)" stroke-width="2"/>`).join("") +
      `<text x="${pts[pts.length - 1][0] + 6}" y="${pts[pts.length - 1][1] + 3}" class="lab" style="fill:var(--amber)">${margins[margins.length - 1].ebitda_margin}%</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue by year with EBITDA margin">${bars}${line}</svg>
      <div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Revenue, ₹ cr (thousands)</span><span><i style="background:var(--amber)"></i>EBITDA margin (right scale, ${mlo}–${mhi}%)</span></div>`;
  }
  function cashBars(rows) {
    const W = 340, H = 170, pl = 8, pr = 8, pt = 14, pb = 22;
    const vals = rows.flatMap(r => [r.cfo, r.pat || 0]);
    const hi = Math.max(0, ...vals) * 1.1, lo = Math.min(0, ...vals) * 1.1, span = hi - lo || 1;

      return bar(r.pat || 0, -bw - 1, "var(--line)") + bar(r.cfo, 1, r.cfo >= 0 ? "var(--pos)" : "var(--neg)") + `<text x="${x}" y="${H - 7}" text-anchor="middle">${r.y}</text>`;
    }).join("");

  function context() {

  async function answer(q) {

    box.prepend(el);
    const A = el.querySelector(".a"), By = el.querySelector(".by");
    // Network questions, and any question naming someone in your network, never reach a model.
    const na = netAnswer(q);
    if (na) { A.innerHTML = na; A.style.whiteSpace = "normal"; By.textContent = "Answered on this device from your private network. Not sent to a model."; return; }
    const s = await samplerP;
    if (s) {
      try {
        const prompt = `You are FINN, a concise assistant for an Indian equity investor. Answer in at most 90 words, plain text, using ONLY the JSON below (filings, computed results, primary-source research). Name tickers and dates. Amounts are ₹ crore. If the data can't answer, say so in one sentence. Do not use outside knowledge.\n\nDATA:\n${JSON.stringify(context())}\n\nQUESTION: ${q}`;

  const THEME_SYN = { "semis": "semiconductors", "chip": "semiconductors", "osat": "semiconductors", "cable": "cables & wires", "wire": "cables & wires",
    "insolven": "insolvency & restructuring", "ibc": "insolvency & restructuring", "nclt": "insolvency & restructuring", "restructur": "insolvency & restructuring",

    "ems": "EMS", "electronics manufactur": "EMS", "contract manufactur": "EMS", "ev": "autos & EV", "auto": "autos & EV", "bank": "retail banking",
    "nbfc": "NBFC lending", "lending": "NBFC lending", "insur": "insurance", "pharma": "pharma regulation", "usfda": "pharma regulation", "fda": "pharma regulation",
    "power": "power & renewables", "renewab": "power & renewables", "solar": "power & renewables", "copper": "copper", "paint": "paints", "jewel": "jewellery",
    "retail": "fashion retail", "fashion": "fashion retail", "healthcare it": "healthcare IT", "m&a": "M&A integration", "acquisition": "M&A integration",
    "law": "corporate law", "legal": "corporate law", "epc": "EPC & construction", "construction": "EPC & construction", "treasury": "treasury", "capital market": "capital markets" };
  function findTheme(s) {
    const direct = N.index.themes.find(t => s.includes(t.toLowerCase()));
    if (direct) return direct;
    const k = Object.keys(THEME_SYN).sort((a, b) => b.length - a.length).find(k => new RegExp("\\b" + k.replace(/[&]/g, "\\$&")).test(s));
    return k && N.themes[THEME_SYN[k]] ? THEME_SYN[k] : null;
  }
  function findPerson(s) {
    // full name, then a unique surname, then a unique first name (word-bounded): any of these keeps the question on the device
    const names = Object.keys(N.index.people).sort((a, b) => b.length - a.length);
    const uniq = (part, n) => names.filter(m => part(m) === part(n)).length === 1;
    const has = w => w.length > 3 && new RegExp("\\b" + w + "\\b").test(s);
    return names.find(n => s.includes(n)) || names.find(n => uniq(m => m.split(" ").pop(), n) && has(n.split(" ").pop()))
      || names.find(n => uniq(m => m.split(" ")[0], n) && has(n.split(" ")[0]));
  }
  function findOrg(s) {
    const k = Object.keys(N.index.orgs).sort((a, b) => b.length - a.length).find(a => a.length > 2 && new RegExp("\\b" + a.replace(/[.*+?^${}()|[\]\\&]/g, "\\$&") + "\\b").test(s));
    return k ? N.index.orgs[k] : null;

  function netAnswer(q) {

  }
  function localAnswer(q) {
    const s = q.toLowerCase();

      const b = a.length ? a : items.filter(i => i.tier === "act" && daysAgo(i.date) <= 7).sort((x, y) => y.score - x.score).slice(0, 4);
      return esc((a.length ? "In the last 24 hours:\n" : "Nothing material in 24h. This week:\n") + li(b.map(briefLine)));

  // ---------- NETWORK ----------
  function renderNetwork() {
    if (!N) { $("#main").innerHTML = `<section class="view"><div class="empty">No network loaded.</div></section>`; return; }
    const cutoff = new Date(asOf.getTime() - 7 * 864e5).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
    const evs = Object.entries(N.events).map(([id, ev]) => ({ id, ev, it: items.find(i => i.id === id) })).filter(x => x.it && x.it.date >= cutoff)
      .sort((a, b) => b.it.date.localeCompare(a.it.date) || b.it.score - a.it.score);
    const covered = evs.filter(x => N.coverage.items[x.id]).length;
    const who = x => {
      if (x.ev.kind === "event") return x.ev.best;
      const t = N.targets[x.ev.target]; return t.paths[0] || null;
    };
    const row = x => {
      const w = who(x), ok = N.coverage.items[x.id];
      const t = x.ev.kind === "person" ? N.targets[x.ev.target] : null;
      const lead = x.ev.kind === "person" ? `Way in to ${esc(t.name)}:` : "Best placed:";
      const p = w ? `<span>${lead}</span><b style="color:var(--ink)">${esc(NP(w.contact).name)}</b>${strBar(w.label)}${ok ? "" : `<span class="gap">thin</span>`}`
        : `<span class="gap">Gap:</span><span>no path to ${esc(t ? t.name : "anyone")}${x.ev.company_fallback ? `; closest to the company is ${esc(NP(x.ev.company_fallback.contact).name)}` : ""}</span>`;
      return `<button class="cov" data-open="${esc(x.id)}"><span class="tk">${x.it.ticker}</span><span class="t">${esc(x.it.title)}</span><span class="p">${p}</span></button>`;
    };
    const held = S.portfolio.map(p => p.ticker);
    const thin = held.filter(t => !(N.companies[t] || []).some(x => x.label !== "weak" && !x.flag));
    const themes = Object.entries(N.themes).sort((a, b) => b[1][0].score - a[1][0].score);
    const rc = N.reconnect.slice(0, 3);
    $("#main").innerHTML = `<section class="view">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="eyebrow">Your network · <span class="syntag">SYN</span> ${N.meta.contacts} fictional contacts</div>
        <h1 class="h1">Covers ${covered} of ${evs.length} material events in ${weekLabel()}</h1>
        <p class="sub" style="margin:0">Across every material filing in this snapshot (${shortDate(N.coverage.window.from)} – ${shortDate(N.coverage.window.to)}): ${N.coverage.covered} of ${N.coverage.material}. Covered means a medium or strong link to someone who can explain it, scored in code from shared employers, years and batches.</p>
      </div>
      <div class="know-list">${evs.map(row).join("") || `<div class="empty">No material events in ${weekLabel()}.</div>`}</div>
      ${thin.length ? `<div class="flag neutral">Thin spots in your book: nobody you can call freely at ${thin.map(t => `<b>${esc(nameOf(t))}</b>`).join(", ")}. Either nobody is linked, or the only link is weak or a current employee.</div>` : ""}
      <div class="group-h"><h2 class="h2">Who's your go-to for…</h2></div>
      ${(() => {
        const xr = ([th, xs]) => `<div class="xrow"><span class="th">${esc(th)}</span><span class="ppl">${xs.slice(0, 2).map(x => `<button data-person="${esc(x.contact)}">${esc(NP(x.contact).name)}${strBar(x.label)}</button>`).join("")}</span></div>`;
        return `<div class="know-list xmap">${themes.slice(0, 10).map(xr).join("")}</div>
          ${themes.length > 10 ? `<details class="routine"><summary>${themes.length - 10} more themes</summary><div class="xmap" style="margin-top:8px">${themes.slice(10).map(xr).join("")}</div></details>` : ""}`;
      })()}
      ${rc.length ? `<div class="group-h"><h2 class="h2">Worth a call</h2></div>
        <div class="know-list">${rc.map(x => `<button class="cov" data-person="${esc(x.contact)}"><span class="avatar" style="width:28px;height:28px;font-size:11px;border:1.5px dashed var(--accent);background:var(--surface)">${esc(NP(x.contact).initials)}</span><span class="t"><b>${esc(NP(x.contact).name)}</b> · ${esc(x.reason)}</span><span class="p">Natural opener: ${esc(nameOf(x.ticker))} just filed "${esc(x.title)}"</span></button>`).join("")}</div>
        <p class="sub" style="margin:0;font-size:12px">Never suggests a current employee right after a material event.</p>` : ""}
      <p class="sub" style="margin:0;font-size:12px">Private to you: this view is built from a per-user file kept apart from shared market data, and nothing here is sent to a model. Ask the bar "who knows…" or "go-to for…" for anything else.</p>
    </section>`;
  }

  // ---------- first-open tour ----------
  let tourAt = -1;
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tourCard() {
    if (store.get("tour") || tourAt >= 0 || !N) return "";
    return `<div class="tourcard" role="region" aria-label="Start here"><div class="top"><b>Start here</b><span class="sub" style="font-size:12.5px">3 stops · 30 seconds</span><span class="sp"></span><button class="x" data-tour="dismiss" aria-label="Dismiss the tour">×</button></div>
      <ol><li>Your way in to HDFC Bank's new CEO</li><li>What your network covers this week</li><li>Kaynes: what was promised vs delivered</li></ol>
      <button class="btn primary" data-tour="start">Take the tour</button></div>`;
  }
  function tourSteps() {
    const pe = items.find(i => i.ticker === "HDFCBANK" && N.events[i.id] && N.events[i.id].kind === "person")
      || items.find(i => N.events[i.id] && N.events[i.id].kind === "person" && N.targets[N.events[i.id].target].paths.length);
    const t = pe && N.targets[N.events[pe.id].target], p = t && t.paths[0];
    const kt = S.research.KAYNES ? "KAYNES" : Object.keys(S.research)[0], R = S.research[kt];
    const T = R.ledger.tally || {}, kept = (T.beat || 0) + (T.delivered || 0) + (T.on_track || 0);
    return [
      { title: "Your way in", text: p ? `${nameOf(pe.ticker)} named ${t.name} ${t.role}. FINN's best way in is ${NP(p.contact).name} (${p.label}). Every link is scored in code and marked hypothetical.` : "Leadership changes come with your best way in to the new person.",
        show: () => { st.win = "7"; go("brief"); return pe && document.querySelector(`[id="c-${pe.id}"] .net`); } },
      { title: "What your network covers", text: `How many material events in ${weekLabel()} someone you know can explain, where the gaps are, and who your go-to is for each theme.`,
        show: () => { go("network"); return [document.querySelector("#main .view .know-list"), document.querySelector("#main .view > div")]; } },
      { title: "Promised vs delivered", text: `${R.name} kept ${kept} of ${R.ledger.scored} scoreable promises. Each guidance item from four earnings calls is scored in code against reported numbers. Below it, "Who to call" turns the misses into questions.`,
        show: () => { st.rt = kt; go("research"); return document.querySelector("#promises .panel"); } },
    ];
  }
  function tourShow(i) {
    const steps = tourSteps();
    document.querySelectorAll(".tour-hl").forEach(e => e.classList.remove("tour-hl"));
    $("#sheetRoot").innerHTML = "";
    tourAt = i;
    const shown = steps[i].show();
    const [el, anchor] = Array.isArray(shown) ? shown : [shown, shown];   // highlight one element, scroll to another
    let c = $("#coach");
    if (!c) { c = document.createElement("div"); c.id = "coach"; c.className = "coach"; document.body.appendChild(c); }
    c.style.bottom = ($(".dock").offsetHeight + 10) + "px";
    c.innerHTML = `<div class="coach-in" role="dialog" aria-label="Tour step ${i + 1} of ${steps.length}">
      <div class="h">Tour · ${i + 1} of ${steps.length}<span class="sp"></span><button class="x" data-tour="end" aria-label="End the tour">×</button></div>
      <div class="t">${esc(steps[i].title)}</div><p>${esc(steps[i].text)}</p>
      <div class="row">${i > 0 ? `<button class="btn" data-tour="back">Back</button>` : ""}<button class="btn primary" data-tour="${i < steps.length - 1 ? "next" : "end"}">${i < steps.length - 1 ? "Next" : "Done"}</button></div></div>`;
    if (el) {
      el.classList.add("tour-hl");
      requestAnimationFrame(() => {
        // clear the sticky masthead and any sticky bar under it (Research's jump chips)
        const sticky = [...document.querySelectorAll("#main .jump")].reduce((h, e) => h + e.offsetHeight, 0);
        const top = (anchor || el).getBoundingClientRect().top + window.scrollY - $(".mast").offsetHeight - sticky - 14;
        window.scrollTo({ top: Math.max(0, top), behavior: reduceMotion() ? "auto" : "smooth" });
      });
    }
    const btn = c.querySelector(".btn.primary"); if (btn) btn.focus({ preventScroll: true });
  }
  function tourEnd() {
    store.set("tour", "done"); tourAt = -1;
    const c = $("#coach"); if (c) c.remove();
    document.querySelectorAll(".tour-hl").forEach(e => e.classList.remove("tour-hl"));
    st.win = store.get("win", "1");                 // the tour borrowed the 7-day window; give yours back
    if (st.view === "brief") renderBrief();
  }
  function tourStart() { tourShow(0); }

  // ---------- routing ----------
  const VIEWS = { brief: renderBrief, alerts: renderAlerts, book: renderBook, research: renderResearch, network: renderNetwork };
  function go(v, push = true) {
    if (!VIEWS[v]) v = "brief";
    st.view = v; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
    VIEWS[v](); window.scrollTo(0, 0);
    if (push && location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.v));
  window.addEventListener("hashchange", () => go(location.hash.slice(1), false));
  $("#askBtn").onclick = () => askSheet();
  $("#aboutBtn").onclick = aboutSheet;
  document.addEventListener("click", e => {
    const w = e.target.closest("[data-win]"); if (w) { st.win = w.dataset.win; store.set("win", st.win); renderBrief(); return; }
    const c = e.target.closest("[data-clear]"); if (c) { const id = c.dataset.clear; st.cleared.has(id) ? st.cleared.delete(id) : st.cleared.add(id); store.set("cleared", [...st.cleared]); if ($("#sheetRoot").innerHTML) $("#sheetRoot").innerHTML = ""; go(st.view, false); return; }
    const a = e.target.closest("[data-ask]"); if (a) { askSheet(a.dataset.ask); return; }
    const r = e.target.closest("[data-res]"); if (r) { openResult(r.dataset.res); return; }
    const o = e.target.closest("[data-open]"); if (o) { openItem(o.dataset.open); return; }
    const rt = e.target.closest("[data-rt]"); if (rt) { st.rt = rt.dataset.rt; store.set("research", st.rt); renderResearch(); return; }
    const tb = e.target.closest("[data-tour]");
    if (tb) {
      const a = tb.dataset.tour;
      if (a === "start") tourStart();
      else if (a === "dismiss") { store.set("tour", "done"); renderBrief(); }
      else if (a === "next") tourShow(tourAt + 1);
      else if (a === "back") tourShow(tourAt - 1);
      else if (a === "end") tourEnd();
      return;
    }
    const gg = e.target.closest("[data-go]"); if (gg) { e.preventDefault(); $("#sheetRoot").innerHTML = ""; go(gg.dataset.go); return; }
    const pe = e.target.closest("[data-person]"); if (pe) { personSheet(pe.dataset.person); return; }
    const tg = e.target.closest("[data-target]"); if (tg) { e.preventDefault(); targetSheet(tg.dataset.target); return; }
    const gr = e.target.closest("[data-goresearch]"); if (gr) { $("#sheetRoot").innerHTML = ""; st.rt = gr.dataset.goresearch; go("research"); return; }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#sheetRoot").innerHTML) $("#sheetRoot").innerHTML = ""; else if (tourAt >= 0) tourEnd(); } });
  go(location.hash.slice(1) || "brief", false);
})();
</script>
